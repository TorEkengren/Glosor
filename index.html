<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stort Glosförhör - Smarta Ledtrådar & Mixat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 18px;
            color: #b0b0b0;
        }
        textarea {
            width: 100%;
            height: 350px;
            font-family: monospace;
            font-size: 16px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #2d2d2d;
            color: #f8f8f2;
            border: 1px solid #444;
            border-radius: 8px;
            margin-bottom: 25px;
            resize: vertical;
        }
        textarea:focus {
            border-color: #3b82f6;
            outline: none;
        }
        input[type="text"] {
            padding: 16px;
            width: 85%;
            font-size: 22px;
            background-color: #2d2d2d;
            color: #ffffff;
            border: 2px solid #555;
            border-radius: 8px;
            margin-bottom: 25px;
            box-sizing: border-box;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
            outline: none;
        }
        button {
            padding: 16px 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:active {
            transform: scale(0.98);
        }
        button:focus {
            outline: 3px solid #60a5fa;
            outline-offset: 2px;
        }
        #word-display {
            font-size: 42px;
            font-weight: bold;
            margin: 30px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .feedback {
            font-size: 26px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 60px;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.4;
        }
        
        body.mode-correct {
            background-color: #064e3b;
        }
        body.container.mode-correct {
            border-color: #10b981;
        }
        .correct { 
            color: #ffffff; 
            background-color: #059669;
            border: 2px solid #34d399;
        }

        body.mode-incorrect {
            background-color: #7f1d1d;
        }
        .incorrect { 
            color: #ffffff; 
            background-color: #dc2626;
            border: 2px solid #f87171;
        }

        .hidden { display: none; }
        .stats { margin-top: 30px; font-size: 18px; color: #9ca3af; }
        
        .hint-text {
            font-family: monospace;
            letter-spacing: 4px;
            color: #ffcccc;
            font-size: 32px;
            display: block;
            margin-top: 5px;
            white-space: pre-wrap;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            font-size: 17px;
            font-weight: normal;
        }
        .summary-table th {
            background-color: #3b3b3b;
            color: #ffffff;
            padding: 12px 15px;
            text-align: left;
        }
        .summary-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #444;
            text-align: left;
        }
        .summary-table tr:last-child td {
            border-bottom: none;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .badge-hint {
            background-color: #d97706;
            color: #ffffff;
        }
        .badge-wrong {
            background-color: #dc2626;
            color: #ffffff;
        }
    </style>
</head>
<body id="body">

<div class="container" id="setup-area">
    <h2>Dina glosor (JSON-format)</h2>
    <p>Redigera ordlistan nedan om du vill och tryck sedan på startknappen.</p>
    <textarea id="json-input">{
  "bron": "die Brücke",
  "ljus": "hell",
  "hög/t": "hoch",
  "absolut": "unbedingt",
  "sätta upp tältet": "das Zelt aufbauen",
  "någonstans": "irgendwo",
  "på något sätt": "irgendwie",
  "helvetet": "die Hölle",
  "kyrkan": "die Kirche",
  "meningen": "der Sinn",
  "det roliga": "der Spaß",
  "stolen": "der Stuhl",
  "Tysklands största ö": "Rügen",
  "åska": "donnern",
  "upptagen / upptaget": "besetzt",
  "klippan": "der Fels",
  "upplevelsen": "das Erlebnis",
  "myggan": "die Mücke",
  "kön": "der Stau",
  "trakten, området": "die Gegend",
  "drunkna": "ertrinken",
  "brant": "steil"
}</textarea>
    <br>
    <button onclick="startQuiz()">Starta förhöret</button>
</div>

<div class="container hidden" id="quiz-area">
    <h2 id="question-header">Vad är detta på tyska?</h2>
    <div id="word-display"></div>
    
    <input type="text" id="answer-input" placeholder="Skriv svaret och tryck Enter..." autocomplete="off">
    <br>
    <button id="action-btn" onclick="handleAction()">Svara</button>
    
    <div id="feedback" class="feedback"></div>
    
    <div class="stats" id="stats"></div>
</div>

<script>
    let quizItems = [];
    let currentIndex = 0;
    let scoreDirect = 0;
    let scoreHint = 0;
    let currentMistakes = 0;
    let isWaitingForNext = false;
    let reviewList = []; // Sparar ord som blev fel eller behövde ledtråd

    document.getElementById("answer-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            handleAction();
        }
    });

    function handleAction() {
        if (isWaitingForNext) {
            nextWord();
        } else {
            checkAnswer();
        }
    }

    function startQuiz() {
        const jsonText = document.getElementById("json-input").value;
        try {
            const wordsData = JSON.parse(jsonText);
            const entries = Object.entries(wordsData);
            
            if (entries.length === 0) {
                alert("Listan är tom!");
                return;
            }

            // Slumpa ordningen på glosorna
            entries.sort(() => Math.random() - 0.5);

            // Skapa frågor: Hälften SV->DE, Hälften DE->SV
            quizItems = entries.map((pair, index) => {
                const isSvToDe = index < entries.length / 2;
                return {
                    question: isSvToDe ? pair[0] : pair[1],
                    answer: isSvToDe ? pair[1] : pair[0],
                    targetLang: isSvToDe ? "tyska" : "svenska",
                    swedish: pair[0],
                    german: pair[1]
                };
            });

            // Slumpa igen så att språken blandas jämnt i förhöret
            quizItems.sort(() => Math.random() - 0.5);
            
            currentIndex = 0;
            scoreDirect = 0;
            scoreHint = 0;
            reviewList = [];
            
            document.getElementById("setup-area").classList.add("hidden");
            document.getElementById("quiz-area").classList.remove("hidden");
            
            showWord();
        } catch (e) {
            alert("Ogiltigt JSON-format! Kontrollera citattecken och kommatecken.");
        }
    }

    function showWord() {
        isWaitingForNext = false;
        currentMistakes = 0;
        
        document.getElementById("body").className = "";
        const feedbackEl = document.getElementById("feedback");
        feedbackEl.innerHTML = "";
        feedbackEl.className = "feedback";
        
        const inputEl = document.getElementById("answer-input");
        const btnEl = document.getElementById("action-btn");
        
        inputEl.value = "";
        inputEl.disabled = false;
        inputEl.focus(); 
        
        btnEl.textContent = "Svara";
        
        if (currentIndex < quizItems.length) {
            const item = quizItems[currentIndex];
            document.getElementById("question-header").textContent = `Vad är detta på ${item.targetLang}?`;
            document.getElementById("word-display").textContent = item.question;
            document.getElementById("stats").textContent = `Ord: ${currentIndex + 1} / ${quizItems.length} | Direkt: ${scoreDirect} | Med ledtråd: ${scoreHint}`;
        } else {
            endQuiz();
        }
    }

    function checkAnswer() {
        const item = quizItems[currentIndex];
        const correctAnswer = item.answer;
        const inputEl = document.getElementById("answer-input");
        const userAnswer = inputEl.value.trim();
        
        if (userAnswer === "") return;

        const feedbackEl = document.getElementById("feedback");
        const bodyEl = document.getElementById("body");
        const btnEl = document.getElementById("action-btn");
        
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
            if (currentMistakes === 0) {
                feedbackEl.textContent = "RÄTT!";
                scoreDirect++;
            } else {
                feedbackEl.textContent = "RÄTT (med ledtråd)!";
                scoreHint++;
                // Spara till repetitionstabellen
                reviewList.push({
                    swedish: item.swedish,
                    german: item.german,
                    status: "Med ledtråd"
                });
            }
            
            feedbackEl.className = "feedback correct";
            bodyEl.className = "mode-correct";
            
            inputEl.disabled = true;
            btnEl.textContent = "Nästa ord (Tryck Enter)";
            btnEl.focus(); 
            
            document.getElementById("stats").textContent = `Ord: ${currentIndex + 1} / ${quizItems.length} | Direkt: ${scoreDirect} | Med ledtråd: ${scoreHint}`;
            isWaitingForNext = true;
        } else {
            currentMistakes++;

            if (currentMistakes === 1) {
                // Första felet: Visa första bokstaven samt mellanslag/tecken
                let hint = "";
                for (let i = 0; i < correctAnswer.length; i++) {
                    const char = correctAnswer[i];
                    if (i === 0 || char === " " || char === "/" || char === "-" || char === ",") {
                        hint += char;
                    } else {
                        hint += "_";
                    }
                }

                feedbackEl.innerHTML = `FEL! Försök igen.<br><span class="hint-text">${hint}</span>`;
                feedbackEl.className = "feedback incorrect";
                bodyEl.className = "mode-incorrect";
                
                inputEl.value = "";
                inputEl.focus();
            } else {
                // Andra felet: Visa hela svaret och spara som fel
                reviewList.push({
                    swedish: item.swedish,
                    german: item.german,
                    status: "Helt fel"
                });

                feedbackEl.innerHTML = `Tyvärr! Svaret är:<br><span class="hint-text">${correctAnswer}</span>`;
                feedbackEl.className = "feedback incorrect";
                bodyEl.className = "mode-incorrect";
                
                inputEl.disabled = true;
                btnEl.textContent = "Nästa ord (Tryck Enter)";
                btnEl.focus();
                isWaitingForNext = true;
            }
        }
    }

    function nextWord() {
        currentIndex++;
        showWord();
    }

    function endQuiz() {
        document.getElementById("body").className = "";
        document.getElementById("question-header").textContent = "Förhöret är klart!";
        document.getElementById("word-display").textContent = "";
        document.getElementById("answer-input").classList.add("hidden");
        document.getElementById("stats").textContent = "";
        
        const feedbackEl = document.getElementById("feedback");
        feedbackEl.className = "feedback";
        
        let summaryHTML = `
            <p style="margin-bottom: 10px;">Totalt antal ord: <strong>${quizItems.length}</strong></p>
            <p style="font-size: 18px; color: #34d399; margin: 5px 0;">Rätt direkt: <strong>${scoreDirect}</strong></p>
            <p style="font-size: 18px; color: #fbbf24; margin: 5px 0;">Rätt med ledtråd: <strong>${scoreHint}</strong></p>
            <p style="font-size: 18px; color: #f87171; margin: 5px 0 20px 0;">Helt fel: <strong>${quizItems.length - scoreDirect - scoreHint}</strong></p>
        `;
        
        if (reviewList.length > 0) {
            summaryHTML += `
                <div style="margin-top: 25px; text-align: left;">
                    <h3 style="color: #ffffff; text-align: center; margin-bottom: 10px;">Ord att repetera (${reviewList.length} st):</h3>
                    <table class="summary-table">
                        <thead>
                            <tr>
                                <th>Svenska</th>
                                <th>Tyska</th>
                                <th>Resultat</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            reviewList.forEach(item => {
                const badgeClass = item.status === "Med ledtråd" ? "badge-hint" : "badge-wrong";
                summaryHTML += `
                    <tr>
                        <td style="color: #e0e0e0;">${item.swedish}</td>
                        <td style="color: #60a5fa; font-weight: bold;">${item.german}</td>
                        <td><span class="status-badge ${badgeClass}">${item.status}</span></td>
                    </tr>
                `;
            });
            summaryHTML += `
                        </tbody>
                    </table>
                </div>
            `;
        } else {
            summaryHTML += `<p style="color: #34d399; font-size: 24px; margin-top: 20px;">Fantastiskt! Alla rätt på första försöket! 🎉</p>`;
        }
        
        feedbackEl.innerHTML = summaryHTML;
        
        const btnEl = document.getElementById("action-btn");
        btnEl.textContent = "Börja om";
        btnEl.focus();
        btnEl.onclick = () => {
            document.getElementById("quiz-area").classList.add("hidden");
            document.getElementById("setup-area").classList.remove("hidden");
            document.getElementById("answer-input").classList.remove("hidden");
            btnEl.onclick = handleAction; 
        };
    }
</script>

</body>
</html>
