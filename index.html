<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stort Glosförhör - Smarta Ledtrådar</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 800px;

            text-align: center;

        }

            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        h3 {
            font-size: 22px;
        }

        p {
            font-size: 18px;

        }

        textarea {
            width: 100%;
            height: 350px;
            font-family: monospace;
            font-size: 16px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #2d2d2d;

            border-color: #3b82f6;

            padding: 16px;
            width: 85%;
            font-size: 22px;

            border-radius: 8px;

            box-sizing: border-box;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            outline: none;
        }

        button {
            padding: 16px 35px;

            font-weight: bold;
            cursor: pointer;
            background-color: #2563eb;

            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #1d4ed8;

            transform: scale(0.98);

        }
    </style>
</head>

<body id="body">

<div class="container" id="setup-area">

    <h2>Dina glosor (JSON-format)</h2>

    <p>
        Redigera ordlistan nedan om du vill och tryck sedan på startknappen.
    </p>

    <textarea id="json-input">{
  "bron": "die Brücke",
  "ljus": "hell",
  "hög/t": "hoch",
  "absolut": "unbedingt",
  "sätta upp tältet": "das Zelt aufbauen",
  "någonstans": "irgendwo",
  "på något sätt": "irgendwie",
  "helvetet": "die Hölle",
  "kyrkan": "die Kirche",
  "meningen": "der Sinn",
  "det roliga": "der Spaß",
  "stolen": "der Stuhl",
  "Tysklands största ö": "Rügen",
  "åska": "donnern",
  "upptagen / upptaget": "besetzt",
  "klippan": "der Fels",
  "upplevelsen": "das Erlebnis",
  "myggan": "die Mücke",
  "kön": "der Stau",
  "trakten, området": "die Gegend",
  "drunkna": "ertrinken",
  "brant": "steil"
}</textarea>

    <br>

    <button onclick="startQuiz()">
        Starta förhöret
    </button>

</div>


<div class="container hidden" id="quiz-area">

    <h2>Vad är detta på tyska?</h2>

    <div id="word-display"></div>

    <input
        type="text"
        id="answer-input"
        placeholder="Skriv på tyska och tryck Enter..."
        autocomplete="off"
    >

    <br>

    <button id="action-btn" onclick="handleAction()">
        Svara
    </button>

    <div id="feedback" class="feedback"></div>

    <div class="stats" id="stats"></div>

</div>


<script>

    /* =========================
       VARIABLER
    ========================= */

    let wordsData = {};
    let swedishWords = [];

    let currentIndex = 0;

    let score = 0;

    let currentMistakes = 0;

    let isWaitingForNext = false;

    // Sparar ord där användaren fick fel två gånger
    let mistakes = [];

    // Sparar ord som användaren klarade efter ledtråd
    let correctWithHint = [];


    /* =========================
       ENTER-KNAPP
    ========================= */

    document
        .getElementById("answer-input")
        .addEventListener("keypress", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                handleAction();
            }
        });


    /* =========================
       KNAPPENS FUNKTION
    ========================= */

    function handleAction() {

        if (isWaitingForNext) {

            nextWord();

        } else {

            checkAnswer();
        }
    }


    /* =========================
       STARTA FÖRHÖRET
    ========================= */

    function startQuiz() {

        const jsonText =
            document.getElementById("json-input").value;

        try {

            wordsData = JSON.parse(jsonText);

            swedishWords = Object.keys(wordsData);

            if (swedishWords.length === 0) {

                alert("Listan är tom!");

                return;
            }

            // Blanda orden
            swedishWords.sort(
                () => Math.random() - 0.5
            );

            currentIndex = 0;

            score = 0;

            currentMistakes = 0;

            mistakes = [];

            correctWithHint = [];

            document
                .getElementById("setup-area")
                .classList.add("hidden");

            document
                .getElementById("quiz-area")
                .classList.remove("hidden");

            showWord();

        } catch (e) {

            alert(
                "Ogiltigt JSON-format! Kontrollera citattecken och kommatecken."
            );
        }
    }


    /* =========================
       VISA NÄSTA ORD
    ========================= */

    function showWord() {

        isWaitingForNext = false;

        currentMistakes = 0;

        document.getElementById("body").className = "";

        const feedbackEl =
            document.getElementById("feedback");

        feedbackEl.textContent = "";

        feedbackEl.className = "feedback";

        const inputEl =
            document.getElementById("answer-input");

        const btnEl =
            document.getElementById("action-btn");

        inputEl.value = "";

        inputEl.disabled = false;

        inputEl.classList.remove("hidden");

        inputEl.focus();

        btnEl.textContent = "Svara";

        document
            .getElementById("stats")
            .textContent =
            `Ord: ${currentIndex + 1} / ${swedishWords.length} | Rätt direkt: ${score}`;

        if (currentIndex < swedishWords.length) {

            document
                .getElementById("word-display")
                .textContent =
                swedishWords[currentIndex];

        } else {

            endQuiz();
        }
    }


    /* =========================
       KONTROLLERA SVAR
    ========================= */

    function checkAnswer() {

        const currentSwedishWord =
            swedishWords[currentIndex];

        const correctAnswer =
            wordsData[currentSwedishWord];

        const inputEl =
            document.getElementById("answer-input");

        const userAnswer =
            inputEl.value.trim();

        if (userAnswer === "") {

            return;
        }

        const feedbackEl =
            document.getElementById("feedback");

        const bodyEl =
            document.getElementById("body");

        const btnEl =
            document.getElementById("action-btn");


        /* =========================
           RÄTT SVAR
        ========================= */

        if (
            userAnswer.toLowerCase() ===
            correctAnswer.toLowerCase()
        ) {

            // Rätt direkt
            if (currentMistakes === 0) {

                feedbackEl.textContent =
                    "RÄTT!";

                score++;

            }

            // Rätt efter ledtråd
            else {

                feedbackEl.textContent =
                    "RÄTT (med ledtråd)!";

                correctWithHint.push({

                    swedish: currentSwedishWord,

                    german: correctAnswer

                });
            }


            feedbackEl.className =
                "feedback correct";

            bodyEl.className =
                "mode-correct";

            inputEl.disabled = true;

            btnEl.textContent =
                "Nästa ord (Tryck Enter)";

            btnEl.focus();

            document
                .getElementById("stats")
                .textContent =
                `Ord: ${currentIndex + 1} / ${swedishWords.length} | Rätt direkt: ${score}`;

            isWaitingForNext = true;

        }


        /* =========================
           FEL SVAR
        ========================= */

        else {

            currentMistakes++;


            /* FÖRSTA FELET */

            if (currentMistakes === 1) {

                let hint = "";

                for (
                    let i = 0;
                    i < correctAnswer.length;
                    i++
                ) {

                    const char =
                        correctAnswer[i];

                    if (
                        i === 0 ||
                        char === " " ||
                        char === "/" ||
                        char === "-"
                    ) {

                        hint += char;

                    } else {

                        hint += "_";
                    }
                }


                feedbackEl.innerHTML =
                    `FEL! Försök igen.<br>
                    <span class="hint-text">${hint}</span>`;


                feedbackEl.className =
                    "feedback incorrect";

                bodyEl.className =
                    "mode-incorrect";

                inputEl.value = "";

                inputEl.focus();
            }


            /* ANDRA FELET */

            else {

                // Spara misstaget
                mistakes.push({

                    swedish: currentSwedishWord,

                    german: correctAnswer

                });


                feedbackEl.innerHTML =
                    `Tyvärr! Svaret är:<br>
                    <span class="hint-text">${correctAnswer}</span>`;


                feedbackEl.className =
                    "feedback incorrect";

                bodyEl.className =
                    "mode-incorrect";

                inputEl.disabled = true;

                btnEl.textContent =
                    "Nästa ord (Tryck Enter)";

                btnEl.focus();

                isWaitingForNext = true;
            }
        }
    }


    /* =========================
       NÄSTA ORD
    ========================= */

    function nextWord() {

        currentIndex++;

        showWord();
    }


    /* =========================
       FÖRHÖRET KLART
    ========================= */

    function endQuiz() {

        document.getElementById("body").className = "";

        const wordDisplay =
            document.getElementById("word-display");


        /* =========================
           RÄKNA STATISTIK
        ========================= */

        const totalWords =
            swedishWords.length;

        const hintCount =
            correctWithHint.length;

        const mistakeCount =
            mistakes.length;


        /* =========================
           BYGG RESULTAT
        ========================= */

        let resultHTML = `

            <h2>🎉 Förhöret är klart!</h2>

            <div class="score-summary">

                <div>
                    🟢 Rätt direkt:
                    <strong>${score}</strong>
                </div>

                <div>
                    🟡 Rätt med ledtråd:
                    <strong>${hintCount}</strong>
                </div>

                <div>
                    🔴 Misstag:
                    <strong>${mistakeCount}</strong>
                </div>

                <div>
                    📚 Totalt:
                    <strong>${totalWords}</strong>
                </div>

            </div>
        `;


        /* =========================
           PERFEKT RESULTAT
        ========================= */

        if (
            score === totalWords
        ) {

            resultHTML += `

                <div class="result-box perfect-box">

                    <h3 class="result-title perfect-title">
                        🎉 Perfekt!
                    </h3>

                    <div>
                        Du hade alla rätt direkt!
                    </div>

                </div>
            `;
        }


        /* =========================
           MISSTAG
        ========================= */

        if (mistakes.length > 0) {

            resultHTML += `

                <div class="result-box mistakes-box">

                    <h3 class="result-title mistakes-title">
                        ❌ Misstag (${mistakes.length})
                    </h3>
            `;


            mistakes.forEach(function(word) {

                resultHTML += `

                    <div class="word-result">

                        <span class="swedish">
                            ${escapeHTML(word.swedish)}
                        </span>

                        →

                        <span class="german">
                            ${escapeHTML(word.german)}
                        </span>

                    </div>
                `;
            });


            resultHTML += `

                </div>
            `;
        }


        /* =========================
           RÄTT MED LEDTRÅD
        ========================= */

        if (correctWithHint.length > 0) {

            resultHTML += `

                <div class="result-box hint-box">

                    <h3 class="result-title hint-title">
                        💡 Rätt med ledtråd (${correctWithHint.length})
                    </h3>
            `;


            correctWithHint.forEach(function(word) {

                resultHTML += `

                    <div class="word-result">

                        <span class="swedish">
                            ${escapeHTML(word.swedish)}
                        </span>

                        →

                        <span class="german">
                            ${escapeHTML(word.german)}
                        </span>

                    </div>
                `;
            });


            resultHTML += `

                </div>
            `;
        }


        /* =========================
           INGA FEL
        ========================= */

        if (
            mistakes.length === 0 &&
            correctWithHint.length === 0
        ) {

            resultHTML += `

                <div class="result-box perfect-box">

                    <h3 class="result-title perfect-title">
                        🏆 Fantastiskt!
                    </h3>

                    <div>
                        Du behövde inte ens en ledtråd!
                    </div>

                </div>
            `;
        }


        /* VISA RESULTAT */

        wordDisplay.innerHTML =
            resultHTML;


        /* GÖM SVARSFÄLT */

        document
            .getElementById("answer-input")
            .classList.add("hidden");


        /* TÖM FEEDBACK */

        document
            .getElementById("feedback")
            .textContent = "";


        document
            .getElementById("stats")
            .textContent = "";


        /* =========================
           BÖRJA OM-KNAPP
        ========================= */

        const btnEl =
            document.getElementById("action-btn");

        btnEl.textContent =
            "Börja om";

        btnEl.focus();


        btnEl.onclick = function() {

            document
                .getElementById("quiz-area")
                .classList.add("hidden");

            document
                .getElementById("setup-area")
                .classList.remove("hidden");

            document
                .getElementById("answer-input")
                .classList.remove("hidden");


            // Återställ knappens funktion
            btnEl.onclick =
                handleAction;
        };
    }


    /* =========================
       SKYDDA HTML
       ========================= */

    function escapeHTML(text) {

        return String(text)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");
    }

</script>

</body>
</html>
```
