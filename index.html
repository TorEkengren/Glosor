<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stort Glosförhör - Byggläge & Anpassat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            transition: background-color 0.3s ease;
        }
        .container {
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            color: #b0b0b0;
        }

        .settings-card {
            background-color: #262626;
            border: 1px solid #3d3d3d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .settings-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 19px;
            color: #60a5fa;
            text-align: center;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .settings-grid { grid-template-columns: 1fr; }
        }
        .field {
            display: flex;
            flex-direction: column;
        }
        .field label {
            font-size: 14px;
            color: #a3a3a3;
            margin-bottom: 6px;
        }
        .field input[type="text"], .field select {
            padding: 10px 12px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            box-sizing: border-box;
        }
        
        .slider-group {
            text-align: center;
            margin-top: 15px;
            border-top: 1px solid #3d3d3d;
            padding-top: 15px;
        }
        .slider-group label {
            display: block;
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
        }
        input[type="range"] {
            width: 65%;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .ratio-badge {
            background-color: #3b82f6;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
        }
        .ratio-desc {
            font-size: 13px;
            color: #a3a3a3;
            margin-top: 6px;
        }

        textarea {
            width: 100%;
            height: 260px;
            font-family: monospace;
            font-size: 15px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #2d2d2d;
            color: #f8f8f2;
            border: 1px solid #444;
            border-radius: 8px;
            margin-bottom: 20px;
            resize: vertical;
        }
        textarea:focus, input[type="text"]:focus, select:focus {
            border-color: #3b82f6;
            outline: none;
        }

        #answer-input {
            padding: 16px;
            width: 85%;
            font-size: 22px;
            background-color: #2d2d2d;
            color: #ffffff;
            border: 2px solid #555;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .option-btn {
            background-color: #2a2a2a;
            border: 2px solid #444;
            color: #ffffff;
            padding: 16px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #3b82f6;
            border-color: #60a5fa;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.8;
        }
        .option-btn.correct-choice {
            background-color: #059669 !important;
            border-color: #34d399 !important;
            color: white;
        }
        .option-btn.wrong-choice {
            background-color: #dc2626 !important;
            border-color: #f87171 !important;
            color: white;
        }

        button.primary-btn {
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button.primary-btn:hover { background-color: #1d4ed8; }
        button.primary-btn:active { transform: scale(0.98); }

        #word-display {
            font-size: 40px;
            font-weight: bold;
            margin: 25px 0;
            color: #ffffff;
        }
        .feedback {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 50px;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.4;
        }
        
        body.mode-correct { background-color: #064e3b; }
        .correct { 
            color: #ffffff; 
            background-color: #059669;
            border: 2px solid #34d399;
        }

        body.mode-incorrect { background-color: #7f1d1d; }
        .incorrect { 
            color: #ffffff; 
            background-color: #dc2626;
            border: 2px solid #f87171;
        }

        .hidden { display: none !important; }
        .stats { margin-top: 25px; font-size: 17px; color: #9ca3af; }
        
        .hint-text {
            font-family: monospace;
            letter-spacing: 4px;
            color: #ffcccc;
            font-size: 30px;
            display: block;
            margin-top: 5px;
            white-space: pre-wrap;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            font-size: 16px;
        }
        .summary-table th {
            background-color: #3b3b3b;
            color: #ffffff;
            padding: 10px 12px;
            text-align: left;
        }
        .summary-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #444;
            text-align: left;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .badge-hint { background-color: #d97706; color: #ffffff; }
        .badge-wrong { background-color: #dc2626; color: #ffffff; }
        
        .end-btn-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .end-btn-group button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        .save-indicator {
            font-size: 13px;
            color: #10b981;
            margin-top: -10px;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body id="body">

<div class="container" id="setup-area">
    <h2>Glosförhör - Inställningar</h2>
    <p>Anpassa förhörsläge, språk och fördelning nedan.</p>
    
    <div class="settings-card">
        <h3>Språk & Förhörsläge</h3>
        <div class="settings-grid">
            <div class="field">
                <label for="lang1-name">Språk 1 (Vänster i JSON)</label>
                <input type="text" id="lang1-name" value="Svenska">
            </div>
            <div class="field">
                <label for="lang2-name">Språk 2 (Höger i JSON)</label>
                <input type="text" id="lang2-name" value="Tyska">
            </div>
            <div class="field" style="grid-column: span 2;">
                <label for="quiz-mode-select">Förhörstyp</label>
                <select id="quiz-mode-select">
                    <option value="write">Skrivläge (skriv svaret själv)</option>
                    <option value="choice">Flervalsläge (välj mellan 4 alternativ)</option>
                    <option value="build">Byggläge (1 ord ➔ 2 ord ➔ 3 ord...)</option>
                </select>
            </div>
        </div>
        
        <div class="slider-group">
            <label>Språkfördelning (Chans per ord)</label>
            <div class="slider-container">
                <input type="range" id="ratio-slider" min="0" max="100" value="50">
                <span class="ratio-badge" id="ratio-badge">50% / 50%</span>
            </div>
            <div class="ratio-desc" id="ratio-desc">
                50% chans att översätta till Tyska | 50% chans att översätta till Svenska
            </div>
        </div>
    </div>

    <textarea id="json-input" placeholder='{\n  "svenska": "tyska"\n}'>{}</textarea>
    <span class="save-indicator" id="save-status">✓ Sparas automatiskt</span>
    <button class="primary-btn" onclick="startQuiz()">Starta förhöret</button>
</div>

<div class="container hidden" id="quiz-area">
    <h2 id="question-header">Vad är detta på tyska?</h2>
    <div id="word-display"></div>
    
    <!-- Skrivläge -->
    <div id="write-container">
        <input type="text" id="answer-input" placeholder="Skriv svaret och tryck Enter..." autocomplete="off">
    </div>

    <!-- Flervalsläge -->
    <div id="options-container" class="options-grid hidden"></div>

    <br>
    <button id="action-btn" class="primary-btn" onclick="handleAction()">Svara</button>
    
    <div id="feedback" class="feedback"></div>
    <div class="stats" id="stats"></div>
</div>

<script>
    const STORAGE_KEY = "saved_glosor_data";
    const SETTINGS_KEY = "saved_glosor_settings_v3";

    let quizItems = [];
    let fullDeck = []; 
    let currentIndex = 0;
    let scoreDirect = 0;
    let scoreHint = 0;
    let currentMistakes = 0;
    let isWaitingForNext = false;
    let reviewList = []; 
    let lastFullEntries = [];

    // Variabler för Byggläge (Stegvis)
    let buildPoolSize = 1; 
    let buildPassedRound = true;

    window.addEventListener("DOMContentLoaded", () => {
        const savedText = localStorage.getItem(STORAGE_KEY);
        if (savedText) document.getElementById("json-input").value = savedText;

        const savedSettings = localStorage.getItem(SETTINGS_KEY);
        if (savedSettings) {
            try {
                const s = JSON.parse(savedSettings);
                if (s.lang1) document.getElementById("lang1-name").value = s.lang1;
                if (s.lang2) document.getElementById("lang2-name").value = s.lang2;
                if (s.ratio !== undefined) document.getElementById("ratio-slider").value = s.ratio;
                if (s.mode) document.getElementById("quiz-mode-select").value = s.mode;
            } catch (e) {}
        }
        updateSliderLabel();
    });

    function saveSettings() {
        localStorage.setItem(STORAGE_KEY, document.getElementById("json-input").value);
        const settings = {
            lang1: document.getElementById("lang1-name").value.trim() || "Svenska",
            lang2: document.getElementById("lang2-name").value.trim() || "Tyska",
            ratio: document.getElementById("ratio-slider").value,
            mode: document.getElementById("quiz-mode-select").value
        };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }

    document.getElementById("json-input").addEventListener("input", saveSettings);
    document.getElementById("lang1-name").addEventListener("input", () => { updateSliderLabel(); saveSettings(); });
    document.getElementById("lang2-name").addEventListener("input", () => { updateSliderLabel(); saveSettings(); });
    document.getElementById("ratio-slider").addEventListener("input", () => { updateSliderLabel(); saveSettings(); });
    document.getElementById("quiz-mode-select").addEventListener("change", saveSettings);

    function updateSliderLabel() {
        const l1 = document.getElementById("lang1-name").value.trim() || "Språk 1";
        const l2 = document.getElementById("lang2-name").value.trim() || "Språk 2";
        const ratioL2 = parseInt(document.getElementById("ratio-slider").value, 10);
        const ratioL1 = 100 - ratioL2;

        document.getElementById("ratio-badge").textContent = `${ratioL2}% ${l2} / ${ratioL1}% ${l1}`;
        document.getElementById("ratio-desc").textContent = 
            `${ratioL2}% chans att översätta till ${l2} | ${ratioL1}% chans att översätta till ${l1}`;
    }

    document.getElementById("answer-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            handleAction();
        }
    });

    function handleAction() {
        if (isWaitingForNext) {
            nextWord();
        } else {
            checkAnswer();
        }
    }

    function startQuiz() {
        const jsonText = document.getElementById("json-input").value;
        try {
            const wordsData = JSON.parse(jsonText);
            const entries = Object.entries(wordsData);
            
            if (entries.length === 0) {
                alert("Listan är tom! Lägg till några glosor först.");
                return;
            }

            saveSettings();
            lastFullEntries = entries;
            initQuizFromEntries(entries);
        } catch (e) {
            alert("Ogiltigt JSON-format! Kontrollera att du har korrekt struktur, citattecken och kommatecken.");
        }
    }

    function restartWithErrors(onlyHard = false) {
        const uniqueEntriesMap = new Map();
        reviewList.forEach(item => {
            if (onlyHard) {
                if (item.status === "Helt fel") uniqueEntriesMap.set(item.lang1Val, item.lang2Val);
            } else {
                uniqueEntriesMap.set(item.lang1Val, item.lang2Val);
            }
        });
        
        const entries = Array.from(uniqueEntriesMap.entries());
        if (entries.length > 0) {
            initQuizFromEntries(entries);
        }
    }

    function initQuizFromEntries(entries) {
        const l1 = document.getElementById("lang1-name").value.trim() || "Svenska";
        const l2 = document.getElementById("lang2-name").value.trim() || "Tyska";
        const ratioL2 = parseInt(document.getElementById("ratio-slider").value, 10) / 100;

        const shuffled = [...entries].sort(() => Math.random() - 0.5);

        fullDeck = shuffled.map((pair) => {
            const isToLang2 = Math.random() < ratioL2;
            return {
                question: isToLang2 ? pair[0] : pair[1],
                answer: isToLang2 ? pair[1] : pair[0],
                targetLang: isToLang2 ? l2 : l1,
                lang1Val: pair[0],
                lang2Val: pair[1]
            };
        });

        const mode = document.getElementById("quiz-mode-select").value;

        if (mode === "build") {
            buildPoolSize = 1;
            buildPassedRound = true;
            quizItems = fullDeck.slice(0, buildPoolSize);
        } else {
            quizItems = [...fullDeck].sort(() => Math.random() - 0.5);
        }
        
        currentIndex = 0;
        scoreDirect = 0;
        scoreHint = 0;
        reviewList = [];
        
        document.getElementById("setup-area").classList.add("hidden");
        document.getElementById("quiz-area").classList.remove("hidden");
        
        showWord();
    }

    function showWord() {
        isWaitingForNext = false;
        currentMistakes = 0;
        
        document.getElementById("body").className = "";
        const feedbackEl = document.getElementById("feedback");
        feedbackEl.innerHTML = "";
        feedbackEl.className = "feedback";
        
        const mode = document.getElementById("quiz-mode-select").value;
        const btnEl = document.getElementById("action-btn");
        
        if (currentIndex < quizItems.length) {
            const item = quizItems[currentIndex];
            document.getElementById("question-header").textContent = `Vad är detta på ${item.targetLang.toLowerCase()}?`;
            document.getElementById("word-display").textContent = item.question;
            
            if (mode === "build") {
                document.getElementById("stats").textContent = `Byggläge: ${currentIndex + 1} / ${quizItems.length} (Mål: ${fullDeck.length} ord)`;
            } else {
                document.getElementById("stats").textContent = `Ord: ${currentIndex + 1} / ${quizItems.length} | Direkt: ${scoreDirect} | Med ledtråd: ${scoreHint}`;
            }

            if (mode === "choice") {
                document.getElementById("write-container").classList.add("hidden");
                document.getElementById("options-container").classList.remove("hidden");
                btnEl.classList.add("hidden");
                setupOptions(item);
            } else {
                document.getElementById("write-container").classList.remove("hidden");
                document.getElementById("options-container").classList.add("hidden");
                btnEl.classList.remove("hidden");
                btnEl.textContent = "Svara";
                
                const inputEl = document.getElementById("answer-input");
                inputEl.value = "";
                inputEl.disabled = false;
                inputEl.focus();
            }
        } else {
            if (mode === "build") {
                if (buildPassedRound) {
                    if (buildPoolSize < fullDeck.length) {
                        buildPoolSize++;
                        quizItems = fullDeck.slice(0, buildPoolSize);
                        quizItems.sort(() => Math.random() - 0.5);
                        currentIndex = 0;
                        buildPassedRound = true;
                        showWord();
                        return;
                    }
                } else {
                    quizItems.sort(() => Math.random() - 0.5);
                    currentIndex = 0;
                    buildPassedRound = true;
                    showWord();
                    return;
                }
            }
            endQuiz();
        }
    }

    function setupOptions(currentItem) {
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        const allPossibleAnswers = Array.from(new Set(
            lastFullEntries.map(e => currentItem.targetLang === (document.getElementById("lang2-name").value.trim() || "Tyska") ? e[1] : e[0])
        ));

        let distractors = allPossibleAnswers.filter(a => a.toLowerCase() !== currentItem.answer.toLowerCase());
        distractors.sort(() => Math.random() - 0.5);
        
        let choices = distractors.slice(0, 3);
        choices.push(currentItem.answer);
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(choiceText => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = choiceText;
            btn.onclick = () => checkChoiceAnswer(btn, choiceText, currentItem.answer);
            container.appendChild(btn);
        });
    }

    function checkChoiceAnswer(selectedBtn, selectedText, correctAnswer) {
        if (isWaitingForNext) return;

        const feedbackEl = document.getElementById("feedback");
        const bodyEl = document.getElementById("body");
        const item = quizItems[currentIndex];
        const allOptionBtns = document.querySelectorAll(".option-btn");

        allOptionBtns.forEach(btn => btn.disabled = true);

        if (selectedText.toLowerCase() === correctAnswer.toLowerCase()) {
            selectedBtn.classList.add("correct-choice");
            feedbackEl.textContent = "RÄTT!";
            feedbackEl.className = "feedback correct";
            bodyEl.className = "mode-correct";
            scoreDirect++;
        } else {
            selectedBtn.classList.add("wrong-choice");
            allOptionBtns.forEach(btn => {
                if (btn.textContent.toLowerCase() === correctAnswer.toLowerCase()) {
                    btn.classList.add("correct-choice");
                }
            });

            feedbackEl.innerHTML = `FEL! Rätt svar: <strong>${correctAnswer}</strong>`;
            feedbackEl.className = "feedback incorrect";
            bodyEl.className = "mode-incorrect";

            buildPassedRound = false;
            reviewList.push({
                lang1Val: item.lang1Val,
                lang2Val: item.lang2Val,
                status: "Helt fel"
            });
        }

        const btnEl = document.getElementById("action-btn");
        btnEl.classList.remove("hidden");
        btnEl.textContent = "Nästa ord (Tryck Enter)";
        btnEl.focus();
        isWaitingForNext = true;
    }

    function checkAnswer() {
        const item = quizItems[currentIndex];
        const correctAnswer = item.answer;
        const inputEl = document.getElementById("answer-input");
        const userAnswer = inputEl.value.trim();
        
        if (userAnswer === "") return;

        const feedbackEl = document.getElementById("feedback");
        const bodyEl = document.getElementById("body");
        const btnEl = document.getElementById("action-btn");
        
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
            if (currentMistakes === 0) {
                feedbackEl.textContent = "RÄTT!";
                scoreDirect++;
            } else {
                feedbackEl.textContent = "RÄTT (med ledtråd)!";
                scoreHint++;
                buildPassedRound = false;
                reviewList.push({
                    lang1Val: item.lang1Val,
                    lang2Val: item.lang2Val,
                    status: "Med ledtråd"
                });
            }
            
            feedbackEl.className = "feedback correct";
            bodyEl.className = "mode-correct";
            
            inputEl.disabled = true;
            btnEl.textContent = "Nästa ord (Tryck Enter)";
            btnEl.focus(); 
            isWaitingForNext = true;
        } else {
            currentMistakes++;
            buildPassedRound = false;

            if (currentMistakes === 1) {
                let hint = "";
                for (let i = 0; i < correctAnswer.length; i++) {
                    const char = correctAnswer[i];
                    if (i === 0 || char === " " || char === "/" || char === "-" || char === ",") {
                        hint += char;
                    } else {
                        hint += "_";
                    }
                }

                feedbackEl.innerHTML = `FEL! Försök igen.<br><span class="hint-text">${hint}</span>`;
                feedbackEl.className = "feedback incorrect";
                bodyEl.className = "mode-incorrect";
                
                inputEl.value = "";
                inputEl.focus();
            } else {
                reviewList.push({
                    lang1Val: item.lang1Val,
                    lang2Val: item.lang2Val,
                    status: "Helt fel"
                });

                feedbackEl.innerHTML = `Tyvärr! Svaret är:<br><span class="hint-text">${correctAnswer}</span>`;
                feedbackEl.className = "feedback incorrect";
                bodyEl.className = "mode-incorrect";
                
                inputEl.disabled = true;
                btnEl.textContent = "Nästa ord (Tryck Enter)";
                btnEl.focus();
                isWaitingForNext = true;
            }
        }
    }

    function nextWord() {
        currentIndex++;
        showWord();
    }

    function goToSetup() {
        document.getElementById("quiz-area").classList.add("hidden");
        document.getElementById("setup-area").classList.remove("hidden");
    }

    function endQuiz() {
        const l1 = document.getElementById("lang1-name").value.trim() || "Språk 1";
        const l2 = document.getElementById("lang2-name").value.trim() || "Språk 2";

        document.getElementById("body").className = "";
        document.getElementById("question-header").textContent = "Förhöret är klart!";
        document.getElementById("word-display").textContent = "";
        document.getElementById("write-container").classList.add("hidden");
        document.getElementById("options-container").classList.add("hidden");
        document.getElementById("action-btn").classList.add("hidden");
        document.getElementById("stats").textContent = "";
        
        const feedbackEl = document.getElementById("feedback");
        feedbackEl.className = "feedback";
        
        let summaryHTML = `<p style="color: #34d399; font-size: 24px; margin-bottom: 20px;">🎉 Bra jobbat! Du tog dig igenom hela gloslistan!</p>`;
        
        const uniqueAllErrors = new Map();
        const uniqueHardErrors = new Map();

        reviewList.forEach(item => {
            uniqueAllErrors.set(item.lang1Val, item.lang2Val);
            if (item.status === "Helt fel") {
                uniqueHardErrors.set(item.lang1Val, item.lang2Val);
            }
        });

        if (reviewList.length > 0) {
            summaryHTML += `
                <div style="margin-top: 25px; text-align: left;">
                    <h3 style="color: #ffffff; text-align: center; margin-bottom: 10px;">Ord du behövde träna mer på (${uniqueAllErrors.size} st):</h3>
                    <table class="summary-table">
                        <thead>
                            <tr>
                                <th>${l1}</th>
                                <th>${l2}</th>
                                <th>Resultat</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            reviewList.forEach(item => {
                const badgeClass = item.status === "Med ledtråd" ? "badge-hint" : "badge-wrong";
                summaryHTML += `
                    <tr>
                        <td style="color: #e0e0e0;">${item.lang1Val}</td>
                        <td style="color: #60a5fa; font-weight: bold;">${item.lang2Val}</td>
                        <td><span class="status-badge ${badgeClass}">${item.status}</span></td>
                    </tr>
                `;
            });
            summaryHTML += `
                        </tbody>
                    </table>
                </div>
            `;
        }

        summaryHTML += `<div class="end-btn-group">`;
        summaryHTML += `<button onclick="initQuizFromEntries(lastFullEntries)" style="background-color: #2563eb;">Börja om alla (${lastFullEntries.length})</button>`;
        
        if (uniqueAllErrors.size > 0) {
            summaryHTML += `<button onclick="restartWithErrors(false)" style="background-color: #d97706;">Repetera alla svåra (${uniqueAllErrors.size})</button>`;
        }
        if (uniqueHardErrors.size > 0) {
            summaryHTML += `<button onclick="restartWithErrors(true)" style="background-color: #dc2626;">Repetera bara 'Helt fel' (${uniqueHardErrors.size})</button>`;
        }
        
        summaryHTML += `<button onclick="goToSetup()" style="background-color: #4b5563;">Ändra inställningar</button>`;
        summaryHTML += `</div>`;
        
        feedbackEl.innerHTML = summaryHTML;
    }
</script>

</body>
</html>
